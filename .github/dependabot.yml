version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
